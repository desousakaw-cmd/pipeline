  name: CI-CD Cidades ESG

  on:
    push:
      branches: [master]
    workflow_dispatch:

  jobs:
    build:
      name: Build e testes
      runs-on: ubuntu-latest

      steps:
        - name: Baixar código
          uses: actions/checkout@v5

        - name: Configurar Java 21
          uses: actions/setup-java@v5
          with:
            distribution: temurin
            java-version: '21'
            cache: maven

        - name: Compilar e testar
          run: mvn -B clean verify

    deploy:
      name: Deploy local
      needs: build
      runs-on: [self-hosted, cidades-esg]

      steps:
        - name: Baixar código
          uses: actions/checkout@v5

        - name: Iniciar aplicação
          env:
            MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          run: |
            test -n "$MYSQL_ROOT_PASSWORD"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD" > .env
            docker compose --profile staging up -d --build
            docker compose --profile staging ps
